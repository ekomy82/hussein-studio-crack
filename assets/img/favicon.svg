<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Hussein Studio Crack">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="96" height="96" rx="24" fill="url(#tile)"/>

  <!-- épaules -->
  <path d="M12 84c1.6-9.4 8.6-13.6 18.4-16.2L48 64l17.6 3.8C75.4 70.4 82.4 74.6 84 84z" fill="url(#hood)" opacity=".92"/>

  <!-- capuche -->
  <path d="M48 12c-14.8 0-25.5 11.8-25.5 27.6 0 9.2 3.5 16.9 9.2 22.1L36 66h24l4.3-4.3c5.7-5.2 9.2-12.9 9.2-22.1C73.5 23.8 62.8 12 48 12z" fill="url(#hood)"/>

  <!-- visage dans l'ombre -->
  <path d="M48 23.5c-9.6 0-16.3 8.2-16.3 17.9 0 8.2 3.7 14.6 9.6 18.9h13.4c5.9-4.3 9.6-10.7 9.6-18.9 0-9.7-6.7-17.9-16.3-17.9z" fill="#111120"/>

  <!-- visière lumineuse -->
  <path d="M36.4 43.2l9.9-2.7v4.7l-9.9 2.1z" fill="#38bdf8" filter="url(#glow)"/>
  <path d="M59.6 43.2l-9.9-2.7v4.7l9.9 2.1z" fill="#38bdf8" filter="url(#glow)"/>

  <!-- reflet de capuche -->
  <path d="M31.8 33.6c1.9-5.9 6.4-9.6 11.6-10.6" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="2.4" stroke-linecap="round"/>
</svg>
