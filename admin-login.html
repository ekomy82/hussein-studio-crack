<!DOCTYPE html>
<html lang="fr" dir="ltr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — Hussein Studio Crack</title>
  <link rel="icon" href="assets/img/favicon.svg?v=2" type="image/svg+xml">
  <style>
    :root {
      --bg: #070b14;
      --panel: rgba(15, 22, 35, 0.94);
      --panel-border: rgba(140, 164, 192, 0.18);
      --muted: #9aa9bd;
      --text: #ecf2ff;
      --primary: #8b5cf6;
      --shadow: rgba(13, 18, 28, 0.7);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, rgba(139, 92, 246, 0.25), transparent 28%),
        linear-gradient(160deg, #070b14 0%, #0f1725 40%, #0d1c2d 100%);
      color: var(--text);
      padding: 24px;
    }
    .card {
      width: min(100%, 420px);
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 22px;
      box-shadow: 0 32px 80px var(--shadow);
      overflow: hidden;
    }
    .header {
      padding: 28px 28px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.02em;
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #8b5cf6, #22d3ee);
      box-shadow: 0 12px 28px rgba(139, 92, 246, 0.4);
      font-size: 0.9rem;
    }
    .body { padding: 24px 28px 28px; }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.6rem, 3vw, 2rem);
    }
    p { margin: 0 0 20px; color: var(--muted); line-height: 1.6; }
    label {
      display: block;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(8, 13, 22, 0.7);
      color: var(--text);
      border-radius: 12px;
      padding: 14px 14px;
      font-size: 1rem;
      outline: none;
      margin-bottom: 18px;
    }
    input:focus {
      border-color: rgba(139, 92, 246, 0.8);
      box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.2);
    }
    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #8b5cf6, #6d5ef5);
      color: white;
      padding: 14px 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 15px 30px rgba(109, 94, 245, 0.35);
    }
    .footer {
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
    }
    @media (max-width: 480px) {
      .card { border-radius: 18px; }
      .header, .body { padding-left: 20px; padding-right: 20px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="header">
      <div class="brand">
        <span class="brand-mark">H</span>
        <span>Hussein Studio Crack</span>
      </div>
    </div>
    <div class="body">
      <h1>Connexion admin</h1>
      <p>Entrez le mot de passe pour accéder au panneau de gestion du catalogue.</p>
      <form method="POST" action="/admin-login">
        <label for="password">Mot de passe</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
        <button type="submit">Se connecter</button>
      </form>
      <div class="footer">Accès réservé au propriétaire du site.</div>
    </div>
  </main>
</body>
</html>
