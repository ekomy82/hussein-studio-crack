<!DOCTYPE html>
<html lang="fr" dir="ltr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin — Catalogue Hussein Studio</title>
  <link rel="icon" href="assets/img/favicon.svg?v=2" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css?v=7">
  <link rel="stylesheet" href="assets/css/admin.css?v=5">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("ezoo-theme");
        if (t !== "light" && t !== "dark") t = "dark";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
</head>
<body class="admin">
  <header class="admin-header">
    <div class="wrap">
      <a class="brand" href="index.html">
        <img src="assets/img/favicon.svg?v=2" alt="" width="30" height="30">
        <span>Hussein Studio<small>Catalogue</small></span>
      </a>
      <span class="sep" aria-hidden="true"></span>
      <h1>Éditeur du catalogue</h1>
      <span class="tag">Local</span>

      <div class="actions">
        <button class="btn btn-ghost btn-sm" type="button" id="importBtn">Importer un JSON</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
        <a class="btn btn-ghost btn-sm" href="index.html" target="_blank" rel="noopener">Voir le site ↗</a>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="Changer de thème">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8Z"></path>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="admin-main wrap">
    <aside class="sidebar">
      <div class="sidebar-head">
        <h2>Logiciels (<span id="appCount">0</span>)</h2>
        <button class="mini-btn" type="button" id="addApp" aria-label="Ajouter un logiciel" title="Ajouter un logiciel">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 5v14M5 12h14"></path>
          </svg>
        </button>
      </div>
      <ul class="app-list" id="appList"></ul>
      <button class="btn btn-ghost btn-sm" type="button" id="reloadBtn">Recharger data/apps.json</button>
    </aside>

    <section class="editor" id="editor" aria-live="polite"></section>
  </main>

  <div class="savebar">
    <div class="wrap">
      <span class="status" id="saveStatus">Prêt</span>
      <button class="btn btn-ghost btn-sm" type="button" id="previewBtn">Aperçu JSON</button>
      <button class="btn btn-ghost btn-sm" type="button" id="copyBtn">Copier</button>
      <button class="btn btn-primary btn-sm" type="button" id="exportBtn">Exporter apps.json</button>
    </div>
  </div>

  <dialog class="modal" id="jsonDialog" aria-labelledby="jsonTitle">
    <div class="modal-scroll">
      <div class="modal-head">
        <div>
          <h3 id="jsonTitle">Aperçu du catalogue</h3>
          <p class="meta">data/apps.json</p>
        </div>
        <button class="modal-close" type="button" id="jsonClose" aria-label="Fermer">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M6 6l12 12M18 6 6 18"></path>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <pre class="json-preview" id="jsonPreview"></pre>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <div class="toast-inner">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m5 12 4.5 4.5L19 7"></path>
      </svg>
      <span id="toastText"></span>
    </div>
  </div>

  <script src="assets/js/admin.js?v=3"></script>
</body>
</html>
